<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مرغبان">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>مرغبان</title>
<style>
:root{--orange:#ff720d;--bg:#f4f6f7;--text:#172126}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
#app{position:fixed;inset:0;background:#fff}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:10}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:900;font-size:20px}
.chick{font-size:52px;animation:b .9s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(-7px)}}
#exitBtn{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));z-index:25;border:0;border-radius:999px;min-width:54px;height:54px;padding:0 15px;background:rgba(255,255,255,.94);box-shadow:0 6px 22px #0002;font:900 14px Tahoma,Arial;color:#9b2c2c}
#exitScreen{position:fixed;inset:0;z-index:40;background:#fff;display:none;place-items:center;padding:24px;text-align:center}
#exitScreen.show{display:grid}.exitCard{width:min(360px,100%)}.exitCard h1{font-size:28px;margin:0 0 10px}.exitCard p{font-size:16px;color:#6f797e;line-height:1.8}.exitCard button{width:100%;min-height:60px;border:0;border-radius:18px;background:var(--orange);color:#fff;font:900 18px Tahoma,Arial;margin-top:15px}
</style>
</head>
<body>
<div id="app">
  <iframe id="morghban" src="https://script.google.com/macros/s/AKfycbxmjAbwy_h2cqUhCeaojDtOuBGJQd5gMsnIjOiZjfG5xMTV2436XYrP8DI5WZ95Zcff/exec" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <button id="exitBtn" type="button" onclick="exitApp()">خروج</button>
</div>
<div id="loading"><div class="loader"><div class="chick">🐥</div><div>مرغبان</div></div></div>
<div id="exitScreen"><div class="exitCard"><h1>خارج شدید</h1><p>برای ورود دوباره به مرغبان دکمه زیر را بزن.</p><button onclick="enterApp()">ورود به مرغبان</button></div></div>
<script>
const frame=document.getElementById('morghban');
const loading=document.getElementById('loading');
const exitScreen=document.getElementById('exitScreen');
frame.addEventListener('load',()=>setTimeout(()=>loading.style.display='none',250));
function exitApp(){frame.src='about:blank';document.getElementById('app').style.display='none';exitScreen.classList.add('show')}
function enterApp(){exitScreen.classList.remove('show');document.getElementById('app').style.display='block';loading.style.display='grid';frame.src='https://script.google.com/macros/s/AKfycbxmjAbwy_h2cqUhCeaojDtOuBGJQd5gMsnIjOiZjfG5xMTV2436XYrP8DI5WZ95Zcff/exec'}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
window.addEventListener('pageshow',()=>{try{screen.orientation?.unlock?.()}catch(e){}});
</script>
</body>
</html>
